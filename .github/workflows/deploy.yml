# Lægger automatisk hjemmesiden op hos Simply, hver gang der gemmes på main.
# Kræver to hemmeligheder i GitHub (Settings → Secrets and variables → Actions):
#   FTP_USERNAME  – FTP-brugernavn fra Simply (typisk domænenavnet)
#   FTP_PASSWORD  – FTP-adgangskode fra Simply
name: Upload til Simply

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: simply-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.simply.com
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll
